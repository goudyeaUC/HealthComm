services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
      ASPNNETCORE_URLS: "http://+:8080"

    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data: